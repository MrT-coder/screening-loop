<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.login">Screening Loop Sign in</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login">
    <div class="brand">
      <span class="logo" aria-hidden="true">SL</span>
      <div>
        <h1>Screening Loop <span class="chip chip-neutral" data-i18n="brand.prototype">Prototype</span></h1>
        <p class="subtitle" data-i18n="brand.subtitle.staff">Staff access</p>
      </div>
    </div>
    <div data-lang-switch></div>

    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title" data-i18n="login.heading">Sign in</h2>
      <p class="lead" data-i18n="login.lead">Use your staff account, or explore the prototype in read-only mode.</p>
      <p id="message" class="message" role="alert" hidden></p>
      <form id="login-form" novalidate>
        <label for="username" data-i18n="login.user">User</label>
        <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required>
        <label for="password" data-i18n="login.password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="wide" data-i18n="login.submit">Sign in</button>
      </form>
      <div class="divider"><span data-i18n="login.or">or</span></div>
      <button type="button" id="guest-button" class="secondary wide" data-i18n="login.guest">Continue as guest (read only)</button>
    </section>

    <p class="notice"><strong data-i18n="notice.syntheticStrong">Synthetic data only.</strong> <span data-i18n="notice.prototype">Prototype for demonstration, not a clinical tool.</span></p>
    <p class="footer"><a href="patient.html" data-i18n="login.patientLink">I am a patient</a></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
