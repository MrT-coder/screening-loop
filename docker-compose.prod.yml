name: screening-loop

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD:?set HAPI_DB_PASSWORD in .env}
    volumes:
      - hapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  fhir:
    image: hapiproject/hapi:v8.12.0-2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD:?set HAPI_DB_PASSWORD in .env}
    volumes:
      - ./infra/hapi/application.yaml:/app/config/application.yaml:ro

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - fhir
    environment:
      COORDINATOR_PASSWORD: ${COORDINATOR_PASSWORD:?set COORDINATOR_PASSWORD in .env}
      GP1_PASSWORD: ${GP1_PASSWORD:?set GP1_PASSWORD in .env}
      GP2_PASSWORD: ${GP2_PASSWORD:?set GP2_PASSWORD in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SCREENING_LLM_ENABLED: ${SCREENING_LLM_ENABLED:-false}
    ports:
      - "127.0.0.1:8082:8082"

volumes:
  hapi-db-data:
