greeting=Hola. Puedo contarle sobre su caso de tamizaje, sus medicamentos activos y sus últimos exámenes.
help=Puede preguntarme sobre el estado de su caso de tamizaje, sus medicamentos activos o sus últimos exámenes.
refusal=Solo puedo ayudarle con el estado de su caso de tamizaje, sus medicamentos activos y sus últimos exámenes. Para cualquier consulta médica, comuníquese con su equipo de atención.
noCase=No veo un caso de tamizaje en su registro.
noMedications=No veo medicamentos activos en su registro.
noExams=No veo exámenes recientes en su registro.
medications=Sus medicamentos activos en el registro son: {{MEDICATION_LIST}}. Para cualquier pregunta sobre ellos, consulte a su equipo de atención.
fitPositive=Su última prueba en heces (FIT) se realizó el {{FIT_DATE}} y el resultado fue positivo. Un resultado positivo no es un diagnóstico; significa que se recomienda un examen de seguimiento.
fitNegative=Su última prueba en heces (FIT) se realizó el {{FIT_DATE}} y el resultado fue negativo.
fitUnknown=Su última prueba en heces (FIT) se realizó el {{FIT_DATE}}. Consulte a su equipo de atención sobre el resultado.
overdue=Su caso de tamizaje está en la etapa "{{STAGE_LABEL}}". El siguiente paso estaba previsto para el {{NEXT_STEP_DATE}}, por lo que está tardando más de lo planeado. Si desea una actualización, comuníquese con su equipo de atención.
procedures=Procedimientos recientes en su registro: {{PROCEDURE_LIST}}.
pendingDate=una fecha que aún se está confirmando
reassurance=no es un diagnóstico
datePattern=d 'de' MMMM 'de' yyyy
stage.result-issued=El resultado de su prueba en heces (FIT) ya está disponible y fue positivo. Un resultado positivo no es un diagnóstico; significa que se recomienda un examen de seguimiento. Su equipo de atención está preparando el siguiente paso y planea comunicarse con usted a más tardar el {{NEXT_STEP_DATE}}.
stage.patient-notified=Su equipo de atención le informó sobre su prueba en heces (FIT) positiva. Un resultado positivo no es un diagnóstico. Están esperando que confirme que recibió la información, y lo esperan para el {{NEXT_STEP_DATE}}.
stage.acknowledged=Gracias por confirmar que recibió su resultado. Su equipo de atención está organizando una prueba de confirmación, prevista para el {{NEXT_STEP_DATE}}.
stage.confirmation-done=Su prueba de confirmación ya se realizó. Su equipo de atención la está revisando y decidirá el siguiente paso a más tardar el {{NEXT_STEP_DATE}}.
stage.referral-requested=Su equipo de atención pidió a un servicio de especialistas que le brinde atención. Están esperando la respuesta del servicio, prevista para el {{NEXT_STEP_DATE}}.
stage.referral-rejected=El servicio de especialistas no pudo aceptar la primera derivación. Esto puede ocurrir. Su equipo de atención está gestionando otra, con fecha objetivo {{NEXT_STEP_DATE}}.
stage.referral-accepted=Un servicio de especialistas aceptó su derivación. Su equipo de atención está organizando ahora su cita, con fecha objetivo {{NEXT_STEP_DATE}}.
stage.appointment-booked=Su cita está agendada. El siguiente paso en su registro tiene fecha {{NEXT_STEP_DATE}}. Si necesita cambiarla, comuníquese con su equipo de atención.
stage.treatment-or-surveillance=Ahora está en la etapa de seguimiento con el servicio de especialistas. Su próxima revisión en el registro tiene fecha {{NEXT_STEP_DATE}}.
stage.closed=Su seguimiento de tamizaje está completo y su equipo de atención lo documentó.
stage.closed-without-care=Su seguimiento de tamizaje se cerró por una decisión registrada por su equipo de atención. Si desea continuar, comuníquese con ellos.
label.result-issued=resultado emitido
label.patient-notified=paciente notificado
label.acknowledged=recibido
label.confirmation-done=confirmación realizada
label.referral-requested=derivación solicitada
label.referral-rejected=derivación rechazada
label.referral-accepted=derivación aceptada
label.appointment-booked=cita agendada
label.treatment-or-surveillance=tratamiento o vigilancia
label.closed=cerrado
label.closed-without-care=cerrado sin atención
