label.confirmation-done=confirmation done
label.referral-requested=referral requested
label.referral-rejected=referral rejected
label.referral-accepted=referral accepted
label.appointment-booked=appointment booked
label.treatment-or-surveillance=treatment or surveillance
label.closed=closed
label.closed-without-care=closed without care
