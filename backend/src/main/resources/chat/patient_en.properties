greeting=Hello. I can tell you about your screening case, your active medications and your latest exams.
help=You can ask me about the status of your screening case, your active medications or your latest exams.
refusal=I can only help with the status of your screening case, your active medications and your latest exams. For any medical question, please contact your care team.
noCase=I do not see a screening case on your record.
noMedications=I do not see any active medications on your record.
noExams=I do not see any recent exams on your record.
medications=Your active medications on record are: {{MEDICATION_LIST}}. For any question about them, please ask your care team.
fitPositive=Your latest stool test (FIT) was done on {{FIT_DATE}} and the result was positive. A positive result is not a diagnosis; it means a follow-up check is recommended.
fitNegative=Your latest stool test (FIT) was done on {{FIT_DATE}} and the result was negative.
fitUnknown=Your latest stool test (FIT) was done on {{FIT_DATE}}. Please ask your care team about the result.
overdue=Your screening case is at the stage "{{STAGE_LABEL}}". The next step was planned for {{NEXT_STEP_DATE}}, so it is taking longer than planned. If you would like an update, please contact your care team.
procedures=Recent procedures on your record: {{PROCEDURE_LIST}}.
pendingDate=a date that is still being confirmed
reassurance=not a diagnosis
datePattern=d MMMM yyyy
stage.result-issued=Your stool test (FIT) result is back and it was positive. A positive result is not a diagnosis; it means a follow-up check is recommended. Your care team is preparing the next step and aims to contact you by {{NEXT_STEP_DATE}}.
stage.patient-notified=Your care team has told you about your positive stool test (FIT). A positive result is not a diagnosis. They are waiting for you to confirm that you received the information, and expect that by {{NEXT_STEP_DATE}}.
stage.acknowledged=Thank you for confirming that you received your result. Your care team is arranging a confirmation test, planned by {{NEXT_STEP_DATE}}.
stage.confirmation-done=Your confirmation test has been done. Your care team is reviewing it and will decide the next step by {{NEXT_STEP_DATE}}.
stage.referral-requested=Your care team has asked a specialist service to see you. They are waiting for the service to answer, expected by {{NEXT_STEP_DATE}}.
stage.referral-rejected=The specialist service could not take the first referral. This can happen. Your care team is arranging another one, aiming for {{NEXT_STEP_DATE}}.
stage.referral-accepted=A specialist service has accepted your referral. Your care team is now arranging your appointment, aiming for {{NEXT_STEP_DATE}}.
stage.appointment-booked=Your appointment is booked. The next step on your record is dated {{NEXT_STEP_DATE}}. If you need to change it, please contact your care team.
stage.treatment-or-surveillance=You are now in the follow-up stage with the specialist service. Your next review on record is dated {{NEXT_STEP_DATE}}.
stage.closed=Your screening follow-up is complete and your care team has documented it.
stage.closed-without-care=Your screening follow-up was closed after a decision recorded by your care team. If you would like to continue, please contact them.
label.result-issued=result issued
label.patient-notified=patient notified
