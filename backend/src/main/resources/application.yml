spring:
  application:
    name: screening-loop

server:
  port: 8082
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

screening:
  llm:
    enabled: false
    api-key: ${GROQ_API_KEY:}
    model: llama-3.1-8b-instant
  users:
    - username: coordinator
      password: ${COORDINATOR_PASSWORD:coordinator-demo}
      practitioner: Practitioner/demo-coordinator
      role: COORDINATOR
    - username: gp1
      password: ${GP1_PASSWORD:gp1-demo}
      practitioner: Practitioner/demo-gp-1
      role: CLINICIAN
    - username: gp2
      password: ${GP2_PASSWORD:gp2-demo}
      practitioner: Practitioner/demo-gp-2
      role: CLINICIAN
    - username: guest
      password: guest-demo
      practitioner: Practitioner/demo-guest
      role: GUEST
