name: screening-loop

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD:-hapi_local_dev}
    volumes:
      - hapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  fhir:
    image: hapiproject/hapi:v8.12.0-2
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD:-hapi_local_dev}
    volumes:
      - ./infra/hapi/application.yaml:/app/config/application.yaml:ro
    ports:
      - "127.0.0.1:8090:8080"

volumes:
  hapi-db-data:
